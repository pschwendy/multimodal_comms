[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multimodal-comms"
version = "0.1.0"
description = "Readable, benchmark-neutral multi-agent communication methods"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "multimodal_comms contributors"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
text = ["sentence-transformers>=2.7"]
learning = ["torch>=2.1", "transformers>=4.40", "scikit-learn>=1.3", "scipy>=1.10"]
multimodal = ["Pillow>=10"]
apps = ["flask>=3", "PyYAML>=6"]
dev = ["pytest>=7.4", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.10", "build>=1.2"]
all = [
  "sentence-transformers>=2.7", "torch>=2.1", "transformers>=4.40",
  "scikit-learn>=1.3", "scipy>=1.10", "Pillow>=10", "flask>=3", "PyYAML>=6"
]

[project.scripts]
multimodal-comms = "multimodal_comms.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_comms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

